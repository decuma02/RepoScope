[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope"
version = "0.1.0"
description = "Repository Intelligence & Context Engine"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.app.main:app"
