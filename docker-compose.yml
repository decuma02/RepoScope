version: '3.8'

services:
  reposcope-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reposcope_backend
    ports:
      - "8000:8000"
    environment:
      - REPOSCOPE_ENV=production
      - REPOSCOPE_LOG_LEVEL=info
      - REPOSCOPE_DB_PATH=/app/data/index/reposcope.db
      - WATSONX_APIKEY=${WATSONX_APIKEY:-}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID:-}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
    volumes:
      - reposcope_data:/app/data/index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  reposcope_data:
    driver: local
